# Add venv to gitignore and remove it from git tracking
echo "venv/" >> .gitignore
echo ".venv/" >> .gitignore
echo "data/" >> .gitignore
echo "airflow/logs/" >> .gitignore
echo "__pycache__/" >> .gitignore
echo "*.pyc" >> .gitignore

git rm -r --cached venv/ 2>/dev/null || true
git rm -r --cached .venv/ 2>/dev/null || true
git rm -r --cached data/ 2>/dev/null || true

git add .
git commit -m "Phase 6: Add CI/CD workflow and fix gitignore"
git push origin main